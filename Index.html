<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SVG → HTML Generator</title>
<style>
body { font-family: sans-serif; max-width: 800px; margin: auto; padding: 20px; }
textarea { width: 100%; height: 150px; margin-top: 10px; }
button { margin-top: 10px; padding: 10px 20px; }
#preview { border: 1px solid #ccc; padding: 10px; margin-top: 10px; white-space: pre-wrap; background: #f9f9f9; }
</style>
</head>
<body>

<h2>SVG → HTML Generator (Web-Based)</h2>

<label>Upload SVG:</label><br>
<input type="file" id="svgInput" accept=".svg"><br><br>

<label>Custom CSS (optional):</label><br>
<textarea id="cssInput" placeholder="Add CSS for fonts, colors, etc."></textarea><br>

<button id="generateBtn">Generate HTML</button>
<button id="downloadBtn">Download HTML</button>

<h3>Preview:</h3>
<div id="preview"></div>

<script>
let generatedHTML = "";

document.getElementById('generateBtn').addEventListener('click', function() {
    const file = document.getElementById('svgInput').files[0];
    const customCSS = document.getElementById('cssInput').value;
    if (!file) { alert("Please upload an SVG file."); return; }

    const reader = new FileReader();
    reader.onload = function(event) {
        const svgText = event.target.result;

        // Simple HTML template
        generatedHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Generated Page</title>
<style>
${customCSS}
</style>
</head>
<body>
${svgText}
</body>
</html>`;

        document.getElementById('preview').innerText = generatedHTML;
    };
    reader.readAsText(file);
});

// Download functionality
document.getElementById('downloadBtn').addEventListener('click', function() {
    if (!generatedHTML) { alert("Generate HTML first."); return; }
    const blob = new Blob([generatedHTML], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = "generated_page.html";
    a.click();
    URL.revokeObjectURL(url);
});
</script>

</body>
</html>
