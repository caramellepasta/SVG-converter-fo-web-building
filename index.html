<!DOCTYPE html>
<html lang="en">
<head>
  <!-- 🌐 Meta and title -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SVG to HTML Mapper — Progressive Builder</title>

  <!-- 🎨 External CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 🧠 Tool Title -->
  <h1>SVG to HTML Mapper (Progressive Builder)</h1>

  <!-- 🌓 Mode selector: keep separate mappings for each mode -->
  <div class="toolbar">
    <label for="mode-select"><strong>Mode:</strong></label>
    <select id="mode-select">
      <option value="light" selected>Light</option>
      <option value="dark">Dark</option>
    </select>
  </div>

  <!-- 🧩 Main layout container: Mapper + Preview side-by-side -->
  <div class="container">
    
    <!-- 🧱 Mapper Panel -->
    <div class="mapper-panel">
      <!-- 📂 Upload SVG -->
      <label for="svg-upload"><strong>Upload SVG:</strong></label>
      <input type="file" id="svg-upload" accept=".svg" />

      <!-- 🔍 SVG Preview -->
      <div id="svg-preview"></div>

      <!-- 🏷️ Semantic Tag Selector -->
      <div id="tag-selector" style="display:none;">
        <label for="semantic-tag">Choose a semantic HTML tag:</label>
        <select id="semantic-tag">
          <!-- 🧠 Semantic HTML5 tags -->
          <option value="section">section</option>
          <option value="header">header</option>
          <option value="footer">footer</option>
          <option value="nav">nav</option>
          <option value="main">main</option>
          <option value="article">article</option>
          <option value="aside">aside</option>
          <option value="h1">h1</option>
          <option value="h2">h2</option>
          <option value="h3">h3</option>
          <option value="p">p</option>
          <option value="button">button</option>
          <option value="form">form</option>
          <option value="label">label</option>
          <option value="input">input</option>
          <option value="figure">figure</option>
          <option value="figcaption">figcaption</option>
          <option value="ul">ul</option>
          <option value="ol">ol</option>
          <option value="li">li</option>
          <option value="blockquote">blockquote</option>
        </select>
        <button id="apply-tag">Map element</button>
      </div>

      <!-- ⚙️ Options (kept simple for the progressive builder) -->
      <fieldset>
        <legend>Options</legend>
        <label><input type="checkbox" id="background-enabled" /> Enable background styling</label><br />
        <label><input type="checkbox" id="background-fullscreen" /> Full screen (100vw x 100vh)</label><br />
        <label><input type="checkbox" id="background-repeat" /> Repeat background</label><br />
        <label><input type="checkbox" id="background-absolute" /> Position absolute</label>
      </fieldset>

      <!-- 📁 SVG group list (for quick selection) -->
      <div id="group-list-container"></div>

      <!-- 🧾 HTML Output (current mode only) -->
      <h2>Generated HTML (Current mode)</h2>
      <textarea id="code-output" rows="10"></textarea>
      <button id="copy-html">Copy HTML</button>

      <!-- 🎨 CSS Output (current mode only) -->
      <h2>Generated CSS (Current mode)</h2>
      <textarea id="css-output" rows="10"></textarea>
      <button id="copy-css">Copy CSS</button>
    </div>

    <!-- 🌐 Live Preview Panel -->
    <div class="preview-panel">
      <h2>Live Preview (<span id="mode-label">Light</span>)</h2>
      <iframe id="live-preview"></iframe>
    </div>
  </div>

  <!-- 🧠 Script logic -->
  <script src="scripts.js"></script>
</body>
</html>
