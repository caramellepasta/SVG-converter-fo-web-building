<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SVG to HTML Mapper</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>SVG to HTML Mapper</h1>

  <input type="file" id="svg-upload" accept=".svg" />
  <div id="svg-preview"></div>
<!-- Tag Selector -->
  <label for="semantic-tag">Choose a semantic HTML tag:</label>
<div id="tag-selector" style="display:none;">
<select id="semantic-tag">
  <option value="section">section</option>
  <option value="header">header</option>
  <option value="footer">footer</option>
  <option value="nav">nav</option>
  <option value="main">main</option>
  <option value="article">article</option>
  <option value="aside">aside</option>
  <option value="h1">h1</option>
  <option value="h2">h2</option>
  <option value="h3">h3</option>
  <option value="p">p</option>
  <option value="button">button</option>
  <option value="form">form</option>
  <option value="label">label</option>
  <option value="input">input</option>
  <option value="figure">figure</option>
  <option value="figcaption">figcaption</option>
  <option value="ul">ul</option>
  <option value="ol">ol</option>
  <option value="li">li</option>
  <option value="blockquote">blockquote</option>
</select>
  <button id="apply-tag">Generate HTML</button>
</div>
  <!-- Adding a label -->
<label>
  <input type="checkbox" id="use-svg-source" checked />
  Use original SVG as source
</label>
  <label>
  <input type="checkbox" id="background-toggle" />
  Mark as background layer
</label>
<br />
  <select id="semantic-tag">
<label>
  <input type="checkbox" id="full-width-toggle" />
  Stretch width to full screen
</label>
  <!-- Generator -->
  <h2>Generated HTML</h2>
<textarea id="code-output" rows="10" cols="80"></textarea>
<button onclick="navigator.clipboard.writeText(document.getElementById('code-output').value)">Copy Code</button>
  <!-- CSS Generator -->
<h2>Generated CSS</h2>
<textarea id="css-output" rows="10" cols="80"></textarea>
<button onclick="navigator.clipboard.writeText(document.getElementById('css-output').value)">Copy CSS</button>

  <script src="scripts.js"></script>
</body>
</html>
